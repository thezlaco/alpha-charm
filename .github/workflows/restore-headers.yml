name: restore-headers

# One off. Restores the headers an earlier removal took with it.
#
# The removal was decided from the build graph, and the build graph does not
# contain headers: gn lists sources and ninja lists inputs, while a header
# reaches a compile through the preprocessor and a #include. Nothing in the
# measurement could see them, so 61867 of them went, and the tree stopped
# building. zlib without its zutil.h was the first to say so.
#
# Every header goes back, including the ones no compile will ever ask for.
# Restoring the whole set is the point: a header that turns out to be unused
# costs one file, and a header that is missing costs the build. Once the tree
# builds again, the compile writes depfiles that name exactly the headers used,
# and the surplus can be removed against evidence rather than against a guess.
#
# Only files are added. No commit is rewritten and nothing already merged is
# touched, so the work done since the removal keeps its place.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out with history
        uses: actions/checkout@v4
        with:
          # The commits below are ancestors of HEAD, so the tree alone is not
          # enough: without the history there is nothing to restore from.
          fetch-depth: 0

      - name: Restore the headers each commit deleted
        run: |
          set -euo pipefail
          restored=0
          for commit in e768fad95 efd7d0892 81dcb6f7d; do
            echo "=== $commit ==="
            # The files that commit deleted, restored from the parent, so that
            # anything Charm had changed in them survives the round trip.
            git show --name-only --format="" "$commit" \
              | grep -E '\.(h|hpp|inc)$' | sort -u > /tmp/headers.txt || true
            count=$(wc -l < /tmp/headers.txt)
            echo "$count headers"
            xargs -a /tmp/headers.txt -n 500 git checkout "$commit^" --
            restored=$((restored + count))
          done
          echo "restored $restored headers"

      - name: Say whether anything came back
        run: |
          added=$(git status --porcelain | grep -c '^A' || true)
          echo "files now staged for addition: $added"
          git add --all
          if git diff --cached --quiet; then
            echo "nothing to commit, every header was already present"
            exit 0
          fi

      - name: Push
        run: |
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com \
            commit -F - <<'MESSAGE'
          Put back the headers that were removed with the build graph

          gn lists sources and ninja lists inputs, but a header reaches a
          compile through the preprocessor and a #include, which is not a build
          edge. The removal was measured against the build graph and 61867
          headers went with it, including third_party/zlib/zutil.h, without
          which zlib does not compile.

          Every header deleted by those three commits is restored from the
          parent of the commit that deleted it, so any Charm change to one
          survives. Nothing is rewritten and no earlier commit is touched.
          MESSAGE
          git push origin HEAD:main