name: closure

# Measures how much of the tree the Android browser actually needs.
#
# Separate from the build workflow so it can be run alone. It is the workflow
# that gets run often, because every removal decision depends on the number it
# prints, and starting a six-hour compile alongside it would make the cheap
# measurement wait on the expensive thing and cost an hour of runner time to
# learn nothing.
#
# Manual. The answer changes only when the tree does, so running it on every push
# would spend the scarce resource to recompute a number already known.
#
# The work itself lives in tools/, so the same commands run unchanged on a build
# machine over SSH. This workflow only prepares a machine and calls them.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  closure:
    runs-on: ubuntu-latest

    # Generous, because gclient fetches the NDK and the Android SDK before gn
    # reads a single BUILD file, and that download is the slow part. The job
    # itself is cheap; waiting for its dependencies is not.
    timeout-minutes: 180

    # The depot_tools that gclient itself bootstrapped, passed through the
    # variable tools/closure.sh already reads. Its `gn` is a wrapper that knows
    # where every version of this tree puts the binary, which is worth more than
    # naming a path: the one guessed here, buildtools/linux64/gn/gn, is not
    # where this checkout put it. The wrapper from Chromium's own bundled copy
    # under third_party/depot_tools is the one that does not work, and it is no
    # longer on PATH.
    env:
      CHARM_DEPOT_TOOLS: ${{ github.workspace }}/depot_tools


    steps:
      # Disk before the checkout, for the same reason as the build job: the tree
      # is 5.5 GB, and the dependencies gclient fetches on top of that need room
      # too. This job needs far less than a build does, but not none.
      # This step and everything before it run before src exists, so they take no
      # working directory of their own. The steps below it, which call ./tools and
      # ./build, are inside the checkout; declaring src as the job default instead
      # would apply it here too and the step would fail to start against a
      # directory that has not been created yet.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /usr/local/lib/heroku /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY"
          df -h /

      # A shallow clone, stated rather than left to the default: the history of
      # an imported Chromium tree is large and this job measures a checkout, not
      # a commit. persist-credentials is off because nothing here pushes.
      # Checked out into src rather than into the workspace root, because DEPS
      # writes every path against a solution named src and gclient resolves a
      # path against the solution whose name prefixes it. Checkout into the root
      # and the dependencies land in a sibling src that no BUILD file refers to,
      # while the hooks look for files inside the checkout and do not find them.
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1
          persist-credentials: false

      # No install-build-deps.sh here. It installs the compiler and the X11 and
      # NSS development libraries that compiling needs, which is several GB on a
      # runner this job just freed disk on, and reading a build graph needs none
      # of it: gn is a self-contained binary and runs the tree's own hermetic
      # python. The build workflow installs them for the reason that it
      # compiles.
      #
      # Cloned into the workspace root, which is where tools/fetch-deps.sh looks
      # and where gclient writes .gclient. That root is GITHUB_WORKSPACE itself
      # and not its parent, because the checkout is src inside it: the workspace
      # is the directory containing src, so with the checkout moved down a level
      # everything that belongs to the workspace moved with it.
      #
      # Outside the checkout, which is src, so it cannot end up in the tree that
      # gn measures.
      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"

      # gn needs the tree to be complete before it will read it, and this
      # repository is only the main repository. Nothing is compiled by this.
      - name: Fetch dependencies
        working-directory: src
        run: ./tools/fetch-deps.sh

      # What arrived, and how much of it there is. The step after this one cannot
      # say which of its inputs were missing, only that one was, and the size
      # decides whether the cache above can hold a fetch at all.
      - name: What arrived
        run: |
          ls src/buildtools/linux64 || echo "no buildtools/linux64"
          find src/buildtools -maxdepth 3 -name 'gn*'
          du -sh src/buildtools src/third_party src/.cipd 2>/dev/null || true
          df -h /

      - name: Measure closure
        working-directory: src
        run: ./tools/closure.sh

      # The raw lists go out as an artifact and the numbers are printed, so the
      # next removal decision can be made against this run rather than against
      # an estimate. Nothing is written back to the tree: a measurement that
      # commits itself would make every run a diff, and the figure belongs to a
      # given revision rather than to the branch.
      - name: Summarise
        working-directory: src
        run: |
          printf 'targets reachable:  %s\n' "$(wc -l < out/Closure/deps.txt)"
          printf 'build inputs:       %s\n' "$(wc -l < out/Closure/inputs.txt)"
          printf 'in the repository:  %s\n' "$(wc -l < out/Closure/repo-inputs.txt)"
          printf 'not in the tree:    %s\n' "$(wc -l < out/Closure/non-repo-inputs.txt)"
          printf 'tracked files:      %s\n' "$(git ls-tree -r --name-only HEAD | wc -l)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charm-closure
          path: src/out/Closure/*.txt
          if-no-files-found: warn