name: build

# Measures the Android browser's dependency closure, and builds Charm.
#
# Two jobs because they answer different questions and need different resources.
# `closure` reads the build graph: it runs gn over the tree and compiles
# nothing, so it finishes in minutes and fits on a free runner. `build` compiles,
# so it needs a runner large enough to finish.
#
# Both are manual. Neither produces anything new unless the pinned revision, the
# patch series or the configuration changed, and runner minutes are the scarce
# resource here.
#
# The work itself lives in tools/, so the same commands run unchanged on a build
# machine over SSH. These workflows only prepare a machine and call them.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # How much of the tree the browser actually needs. This is the number every
  # removal decision rests on, and it is worth measuring before removing
  # anything rather than after: a directory being absent from the repository is
  # not evidence that no target reaches it.
  closure:
    runs-on: ubuntu-latest

    # Generous, because gclient fetches the NDK and the Android SDK before gn
    # reads a single BUILD file, and that download is the slow part. The job
    # itself is cheap; waiting for its dependencies is not.
    timeout-minutes: 180

    steps:
      # Disk before the checkout, for the same reason as the build job: the tree
      # is 5.5 GB, and the dependencies gclient fetches on top of that need room
      # too. This job needs far less than a build does, but not none.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                     /usr/local/lib/android /usr/local/lib/heroku \
                     /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # No install-build-deps.sh here. It installs the compiler and the X11 and
      # NSS development libraries that compiling needs, which is several GB on a
      # runner this job just freed disk on, and reading a build graph needs none
      # of it: gn is a self-contained binary and runs the tree's own hermetic
      # python. The build job below installs them for the reason that it
      # compiles.
      #
      # Cloned beside the checkout rather than inside it, because that is where
      # tools/fetch-deps.sh looks and where a workspace expects it. It is also
      # where gclient writes .gclient.
      - name: Install depot_tools
        run: |
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$GITHUB_WORKSPACE/.."

      # gn needs the tree to be complete before it will read it, and this
      # repository is only the main repository. Nothing is compiled by this.
      - name: Fetch dependencies
        run: ./tools/fetch-deps.sh

      - name: Measure closure
        run: ./tools/closure.sh

      # The raw lists go out as an artifact and the numbers are printed, so the
      # next removal decision can be made against this run rather than against
      # an estimate. Nothing is written back to the tree: a measurement that
      # commits itself would make every run a diff, and the figure belongs to a
      # given revision rather than to the branch.
      - name: Summarise
        run: |
          printf 'targets reachable: %s\n' "$(wc -l < out/Closure/deps.txt)"
          printf 'input files:       %s\n' "$(wc -l < out/Closure/inputs.txt)"
          printf 'tracked files:     %s\n' "$(git ls-tree -r --name-only HEAD | wc -l)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charm-closure
          path: out/Closure/*.txt
          if-no-files-found: warn

  build:
    # The free runner is 4 vCPU / 16 GB RAM / 14 GB of disk. Chromium does not
    # fit in 14 GB, so on a standard runner this fails at the fetch stage. Move
    # it by changing this label alone; nothing else needs to change. What a
    # build actually costs is in the table in README.md.
    runs-on: ubuntu-latest

    # Above the 6-hour ceiling GitHub-hosted runners impose, so that a larger
    # runner configured for a long build is not cut off. On a standard runner
    # the job fails on disk long before this matters.
    timeout-minutes: 360

    steps:
      # Recover disk before anything else, including the checkout. This
      # repository is 5.5 GB across 509 570 files, so the checkout itself needs
      # room; freeing space after it would mean freeing it once the disk is
      # already full. What is removed here is software this job never invokes.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                     /usr/local/lib/android /usr/local/lib/heroku \
                     /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY"
          df -h /

      # A shallow clone, stated rather than left to the default: the history of
      # an imported Chromium tree is large and this job builds a checkout, not a
      # commit. persist-credentials is off because nothing here pushes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Host dependencies are not listed here by hand. Chromium ships
      # install-build-deps.sh, which knows the package list for the host it runs
      # on. A hand-written list in a workflow goes stale the moment a
      # distribution renames a package, and did.
      #
      # No platform argument: the script takes flags, not targets. Passing
      # `android` to it was accepted by an older version and is rejected by this
      # one, which is what stopped this job before it reached the checkout.
      - name: Install host dependencies
        run: ./build/install-build-deps.sh --no-prompt

      # Beside the checkout, which is where tools/fetch-deps.sh and
      # tools/build.sh both look for it.
      - name: Install depot_tools
        run: |
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$GITHUB_WORKSPACE/.."

      # The main repository alone is not a buildable tree. This is what puts the
      # NDK, android_deps and the toolchain in place, and it is the step that was
      # missing, which is why the workflow referenced a tool that never existed.
      - name: Fetch dependencies
        run: ./tools/fetch-deps.sh

      - name: Build
        run: ./tools/build.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charm-apk
          path: out/**/apks/*.apk
          if-no-files-found: warn