name: build

# Builds Charm and keeps the APK as an artifact.
#
# Deliberately manual. A Chromium build costs hours of runner time and produces
# nothing new unless the pinned revision, the patch series or the configuration
# changed, so it runs when asked rather than on every push.
#
# The work itself lives in tools/, so the same two commands run unchanged on a
# build machine over SSH. This workflow only prepares a machine and calls them.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    # The free runner is 4 vCPU / 16 GB RAM / 14 GB of disk. Chromium does not
    # fit in 14 GB, so on a standard runner this fails at the fetch stage. Move
    # it by changing this label alone; nothing else needs to change. What a
    # build actually costs is in the table in README.md.
    runs-on: ubuntu-latest

    # Above the 6-hour ceiling GitHub-hosted runners impose, so that a larger
    # runner configured for a long build is not cut off. On a standard runner
    # the job fails on disk long before this matters.
    timeout-minutes: 360

    steps:
      # Recover disk before anything else, including the checkout. This
      # repository is 5.5 GB across 509 570 files, so the checkout itself needs
      # room; freeing space after it would mean freeing it once the disk is
      # already full. What is removed here is software this job never invokes.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                     /usr/local/lib/android /usr/local/lib/heroku \
                     /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY"
          df -h /

      # A shallow clone, stated rather than left to the default: the history of
      # an imported Chromium tree is large and this job builds a checkout, not a
      # commit. persist-credentials is off because nothing here pushes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Host dependencies are not installed here on purpose. Chromium ships
      # install-build-deps.sh, which knows the package list for the host it runs
      # on. A hand-written list in a workflow goes stale the moment a
      # distribution renames a package, and did.
      - name: Install host dependencies
        run: ./build/install-build-deps.sh --no-prompt android

      # depot_tools is not a host package, so install-build-deps.sh does not
      # bring it. It carries gn and autoninja, which tools/build.sh needs.
      - name: Install depot_tools
        run: git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git

      - name: Build
        run: ./tools/build.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charm-apk
          path: out/**/apks/*.apk
          if-no-files-found: warn